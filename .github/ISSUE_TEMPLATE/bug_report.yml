name: Bug report
description: Something in secretsift does not behave as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not paste real credentials, personal data, or unredacted reports. Use synthetic values only.
        For security vulnerabilities use private vulnerability reporting instead (see SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: A small secretsift.yaml and target function, with synthetic data only.
      render: yaml
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: secretsift version
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version and operating system
      placeholder: "3.12 on Ubuntu 24.04"
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output or traceback
      description: Redact anything sensitive before pasting.
      render: text
