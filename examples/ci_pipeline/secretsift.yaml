# CI example: a config that is expected to PASS (exit code 0).
# Replace the target with a callable from your own project.
version: 1
seed: 7
offline: true
sys_path: ["."]

report:
  dir: secretsift-reports
  formats: [terminal, json, html, junit]
  fail_on: deny

synthetic:
  values:
    - {label: customer_api_key, type: synthetic_api_key}

policy:
  mode: strict
  default_action: deny

scenarios:
  - name: safe-login
    category: logging
    target: "secretsift.demo:safe_login"      # replace with "your_package.module:your_function"
    inputs: {api_key: "{{ customer_api_key }}", note: hello}
    data: [customer_api_key]
