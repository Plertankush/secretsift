# Copy to .github/workflows/secretsift.yml in YOUR repository.
name: secretsift

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  privacy-drill:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install your project and secretsift
        run: |
          python -m pip install -r requirements.txt   # your own project's dependencies
          python -m pip install "git+https://github.com/<owner>/secretsift.git"   # placeholder URL: use your real source
      - name: Run privacy drill
        run: secretsift test --config secretsift.yaml --report terminal,json,html,junit --output-dir secretsift-reports --no-color
      - name: Upload reports
        if: always()          # keep the evidence even when the drill fails the job
        uses: actions/upload-artifact@v4
        with:
          name: secretsift-reports
          path: secretsift-reports/
