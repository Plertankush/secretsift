# Log-leak example. Run from the repository root:
#   PYTHONPATH=src python3 -m secretsift test --config examples/log_leak/secretsift.yaml
version: 1
seed: 7
offline: true
sys_path: ["examples/log_leak"]   # relative to the directory you run secretsift from

report:
  dir: secretsift-reports/log_leak
  formats: [terminal, json, html]
  fail_on: deny

synthetic:
  values:
    - {label: customer_api_key, type: synthetic_api_key}

policy:
  mode: strict
  default_action: deny
  rules:
    - id: LOG-1
      data: customer_api_key
      destination: application_logs
      action: deny
      severity: high
      reason: API keys must never be logged
      remediation: Log a masked hint (see mask() in log_leak_app.py), never the key.

scenarios:
  - name: login-leaky            # expected to FAIL (the leak is the point)
    category: logging
    target: "log_leak_app:leaky_login"
    inputs: {api_key: "{{ customer_api_key }}", user: alice}
    data: [customer_api_key]
  - name: login-fixed            # expected to PASS
    category: logging
    target: "log_leak_app:fixed_login"
    inputs: {api_key: "{{ customer_api_key }}", user: alice}
    data: [customer_api_key]
