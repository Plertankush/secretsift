# NOT RUN IN CI: needs a live hosted-provider account and costs money. See README.md.
# WARNING: with offline: false, the prompts below are sent to the hosted providers.
# They contain only synthetic test data, but they do leave your machine and may be billed/retained.
# Run from the repository root, after exporting the keys:
#   export OPENAI_API_KEY=...  ANTHROPIC_API_KEY=...  GEMINI_API_KEY=...
#   PYTHONPATH=src python3 -m secretsift test --config examples/hosted_api/secretsift.yaml --online
version: 1
seed: 7
offline: false
network_allowlist:                  # only these hosts may be contacted while the scenarios run
  - api.openai.com
  - api.anthropic.com
  - generativelanguage.googleapis.com
sys_path: ["."]

report:
  dir: secretsift-reports/hosted_api
  formats: [terminal, json, html]
  fail_on: deny

synthetic:
  values:
    - {label: customer_api_key, type: synthetic_api_key}

policy:
  mode: strict
  default_action: deny

providers:                          # credentials come from env vars; keys are never written here
  openai_hosted:
    type: openai
    api_key_env: OPENAI_API_KEY
    model: YOUR_MODEL_NAME          # a model your account can use
    timeout: 60
  anthropic_hosted:
    type: anthropic
    api_key_env: ANTHROPIC_API_KEY
    model: YOUR_MODEL_NAME          # a model your account can use
    timeout: 60
  gemini_hosted:
    type: gemini
    api_key_env: GEMINI_API_KEY
    model: YOUR_MODEL_NAME          # a model your account can use
    timeout: 60

scenarios:                          # safe_chat sends only a harmless note, not the planted key
  - name: openai-safe-chat
    category: ai_context
    target: "secretsift.demo:safe_chat"
    inputs: {api_key: "{{ customer_api_key }}", note: hello}
    data: [customer_api_key]
    provider: openai_hosted
  - name: anthropic-safe-chat
    category: ai_context
    target: "secretsift.demo:safe_chat"
    inputs: {api_key: "{{ customer_api_key }}", note: hello}
    data: [customer_api_key]
    provider: anthropic_hosted
  - name: gemini-safe-chat
    category: ai_context
    target: "secretsift.demo:safe_chat"
    inputs: {api_key: "{{ customer_api_key }}", note: hello}
    data: [customer_api_key]
    provider: gemini_hosted
