# HTTP-leak example. Run from the repository root:
#   PYTHONPATH=src python3 -m secretsift test --config examples/http_leak/secretsift.yaml
version: 1
seed: 7
offline: true                     # loopback (127.0.0.1) is always allowed; everything else is blocked
sys_path: ["examples/http_leak"]

report:
  dir: secretsift-reports/http_leak
  formats: [terminal, json, html]
  fail_on: deny

synthetic:
  values:
    - {label: customer_api_key, type: synthetic_api_key}

policy:
  mode: strict
  default_action: deny
  rules:
    - id: NET-1
      data: customer_api_key
      destination: http_request
      action: deny
      severity: critical
      reason: API keys must not appear in outbound request URLs, headers or bodies
      remediation: Send credentials in an Authorization header, never in the URL.

scenarios:
  - name: lookup-leaky           # expected to FAIL
    category: network
    target: "http_leak_app:leaky_lookup"
    inputs: {api_key: "{{ customer_api_key }}"}
    data: [customer_api_key]
  - name: lookup-fixed           # expected to PASS
    category: network
    target: "http_leak_app:fixed_lookup"
    inputs: {api_key: "{{ customer_api_key }}"}
    data: [customer_api_key]
  - name: external-call-blocked  # expected to PASS: the offline guard stops the request
    category: network
    target: "http_leak_app:blocked_external_call"
    inputs: {api_key: "{{ customer_api_key }}"}
    data: [customer_api_key]
