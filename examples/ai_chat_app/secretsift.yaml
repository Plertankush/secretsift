# AI-chat example (offline mock provider). Run from the repository root:
#   PYTHONPATH=src python3 -m secretsift test --config examples/ai_chat_app/secretsift.yaml
version: 1
seed: 7
offline: true
sys_path: ["examples/ai_chat_app"]

report:
  dir: secretsift-reports/ai_chat_app
  formats: [terminal, json, html]
  fail_on: deny

synthetic:
  values:
    - {label: customer_email, type: synthetic_email}

policy:
  mode: strict
  default_action: deny

providers:
  safe_ai: {type: mock, behavior: safe}                    # fixed reply, ignores the prompt
  echo_ai: {type: mock, behavior: echo}                    # repeats the user message
  error_ai: {type: mock, behavior: leaky_error}            # raises an error that quotes the prompt
  stream_ai: {type: mock, behavior: echo, chunk_size: 5}   # echo, streamed in 5-character chunks

scenarios:
  - name: prompt-leaky
    category: ai_context
    target: "chat_app:leaky_prompt"
    inputs: {customer_email: "{{ customer_email }}", question: "Where is my order?"}
    data: [customer_email]
    provider: safe_ai
  - name: prompt-fixed
    category: ai_context
    target: "chat_app:fixed_prompt"
    inputs: {customer_email: "{{ customer_email }}", question: "Where is my order?"}
    data: [customer_email]
    provider: safe_ai
  - name: echo-leaky
    category: response
    target: "chat_app:leaky_echo"
    inputs: {customer_email: "{{ customer_email }}", question: "Where is my order?"}
    data: [customer_email]
    provider: echo_ai
    approved_destinations: [ai_request]   # sending the email to the model is accepted here
  - name: echo-fixed
    category: response
    target: "chat_app:fixed_echo"
    inputs: {customer_email: "{{ customer_email }}", question: "Where is my order?"}
    data: [customer_email]
    provider: echo_ai
    approved_destinations: [ai_request]   # sending the email to the model is accepted here
  - name: error-leaky
    category: response
    target: "chat_app:leaky_error"
    inputs: {customer_email: "{{ customer_email }}", question: "Where is my order?"}
    data: [customer_email]
    provider: error_ai
    approved_destinations: [ai_request]   # sending the email to the model is accepted here
    expect_exception: true
  - name: error-fixed
    category: response
    target: "chat_app:fixed_error"
    inputs: {customer_email: "{{ customer_email }}", question: "Where is my order?"}
    data: [customer_email]
    provider: error_ai
    approved_destinations: [ai_request]   # sending the email to the model is accepted here
    expect_exception: true
  - name: stream-leaky
    category: response
    target: "chat_app:leaky_stream"
    inputs: {customer_email: "{{ customer_email }}", question: "Where is my order?"}
    data: [customer_email]
    provider: stream_ai
    approved_destinations: [ai_request]   # sending the email to the model is accepted here
  - name: stream-fixed
    category: response
    target: "chat_app:fixed_stream"
    inputs: {customer_email: "{{ customer_email }}", question: "Where is my order?"}
    data: [customer_email]
    provider: stream_ai
    approved_destinations: [ai_request]   # sending the email to the model is accepted here
