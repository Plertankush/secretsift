# NOT RUN IN CI: needs a local Ollama or llama.cpp server. See README.md.
# Run from the repository root:
#   PYTHONPATH=src python3 -m secretsift test --config examples/local_model/secretsift.yaml
version: 1
seed: 7
offline: true                 # loopback servers (127.0.0.1 / localhost) stay reachable when offline
sys_path: ["."]

report:
  dir: secretsift-reports/local_model
  formats: [terminal, json, html]
  fail_on: deny

synthetic:
  values:
    - {label: customer_api_key, type: synthetic_api_key}

policy:
  mode: strict
  default_action: deny

providers:
  ollama_local:
    type: ollama
    base_url: http://127.0.0.1:11434   # the default Ollama address
    model: YOUR_PULLED_MODEL           # a model you have pulled, e.g. via `ollama pull`
    timeout: 120
  llama_cpp_local:
    type: llama_cpp
    base_url: http://127.0.0.1:8080/v1 # the default llama.cpp server address
    timeout: 120

scenarios:
  - name: ollama-leaky-chat          # expected to FAIL: demo target sends and prints the key
    category: ai_context
    target: "secretsift.demo:leaky_chat"
    inputs: {api_key: "{{ customer_api_key }}", note: hello}
    data: [customer_api_key]
    provider: ollama_local
  - name: ollama-safe-chat           # expected to PASS
    category: ai_context
    target: "secretsift.demo:safe_chat"
    inputs: {api_key: "{{ customer_api_key }}", note: hello}
    data: [customer_api_key]
    provider: ollama_local
  - name: llama-cpp-safe-chat        # expected to PASS
    category: ai_context
    target: "secretsift.demo:safe_chat"
    inputs: {api_key: "{{ customer_api_key }}", note: hello}
    data: [customer_api_key]
    provider: llama_cpp_local
