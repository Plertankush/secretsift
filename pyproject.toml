[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "secretsift"
version = "0.1.0"
description = "Local-first privacy leak rehearsal for AI-powered applications: plant synthetic secrets, observe where they surface, enforce policy, report evidence."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
keywords = ["privacy", "testing", "llm", "pii", "leak-detection", "pytest"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Testing",
  "Topic :: Security",
  "Typing :: Typed",
]
dependencies = [
  "pydantic>=2.6",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
httpx = ["httpx>=0.27"]
pytest = ["pytest>=8"]
dev = ["pytest>=8", "pytest-cov>=5", "httpx>=0.27", "ruff>=0.5", "mypy>=1.10", "types-PyYAML"]

[project.scripts]
secretsift = "secretsift.cli:app"
sift = "secretsift.cli:app"

[project.entry-points.pytest11]
secretsift = "secretsift.integrations.pytest_plugin"

[tool.hatch.build.targets.wheel]
packages = ["src/secretsift"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
# Tests and examples deliberately contain leaky code, fake credentials, odd unicode test data and
# long literal strings, so security/style rules that target production code are relaxed there.
"tests/**" = ["S", "E501", "SIM117", "RUF001", "RUF002", "RUF003", "RUF012", "RUF015", "RUF059"]
"examples/**" = ["S", "E501", "RUF059"]
# Enum member values such as "synthetic_password" are labels, not credentials.
"src/secretsift/models.py" = ["S105", "S106"]
"src/secretsift/demo.py" = ["S105", "S106"]
"src/secretsift/evidence/redaction.py" = ["S105", "RUF001"]
"src/secretsift/reporting/safe_io.py" = ["RUF001"]
"src/secretsift/instrumentation/capture.py" = ["SIM102"]
"src/secretsift/providers/transport.py" = ["SIM102"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
files = ["src/secretsift"]
